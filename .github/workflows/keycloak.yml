name: CI/CD

# Controls when the action will run. 
on:
  # When a release is published
  release:
    types: [published]

  # Push excluding tags and workflow changes
  push:
    branches:
        - main
    tags-ignore:
      - '*.*'
    paths-ignore:
      - '**/*.md'

  # Validate pull requests without publishing
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Set tags
        id: set-tags
        run: |
          if [ -z "$TAG" ]; then
            echo "TAG=-t openremote/keycloak:develop" >> $GITHUB_ENV
            echo "keycloakDockerImage=openremote/keycloak:develop" >> $GITHUB_OUTPUT
          else
            echo "TAG=-t openremote/keycloak:latest -t openremote/keycloak:$TAG" >> $GITHUB_ENV
            echo "keycloakDockerImage=openremote/keycloak:$TAG" >> $GITHUB_OUTPUT
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and gradle cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew installDist

      - name: Install QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/aarch64

      - name: Install Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and load Keycloak image for Grype scan
        timeout-minutes: 20
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64 # "ubuntu-latest" runs on x86 GitHub runners
          load: true # Load image locally for Grype Scan
          push: false
          tags: ${{ steps.set-tags.outputs.keycloakDockerImage }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Scan Keycloak Docker image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: keycloak-anchore-scan
        with:
          image: ${{ steps.set-tags.outputs.keycloakDockerImage }}
          fail-build: true
          severity-cutoff: critical

      - name: Upload Anchore scan SARIF report
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ steps.keycloak-anchore-scan.outputs.sarif }}

      - name: Inspect Anchore scan SARIF report
        if: ${{ !cancelled() }}
        run: cat ${{ steps.keycloak-anchore-scan.outputs.sarif }}

      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets._TEMP_DOCKERHUB_USER }}
          password: ${{ secrets._TEMP_DOCKERHUB_PASSWORD }}

      - name: Build multi-platform Keycloak image
        if: ${{ github.event_name != 'pull_request' }}
        timeout-minutes: 20
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/aarch64
          load: false
          push: true
          tags: ${{ steps.set-tags.outputs.keycloakDockerImage }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
