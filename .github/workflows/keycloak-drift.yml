# Checks this theme against the Keycloak it is written for, which nothing else in CI does.
#
# The build only proves the theme compiles and packages. It cannot say whether the pages this
# theme replaces still exist upstream, or whether the message keys it names are still defined,
# so this does, against the version the Dockerfile pins. On a branch that moves that version it
# also reports which of Keycloak's own versions of our pages changed, into the job summary.
#
# Separate from the CI/CD workflow on purpose: this is the one job that reaches Maven Central,
# and a release build must not fail because that was unreachable.
name: Keycloak check

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'theme/ui/src/**'
      - 'theme/ui/scripts/check-keycloak-drift.mjs'
      # Read by the check: which pages the theme implements, and the parent theme the rest fall
      # through to.
      - 'theme/ui/scripts/implemented-pages.mjs'
      - 'theme/build.gradle'
      - '.github/workflows/keycloak-drift.yml'
      # The check reads keycloakify's bundled message set, so an upgrade of it changes the answer.
      - 'theme/ui/package.json'
      - 'theme/ui/yarn.lock'
      - 'theme/ui/dev-server/**'
      - 'theme/build.gradle'

  pull_request:
    paths:
      - 'Dockerfile'
      - 'theme/ui/src/**'
      - 'theme/ui/scripts/check-keycloak-drift.mjs'
      # Read by the check: which pages the theme implements, and the parent theme the rest fall
      # through to.
      - 'theme/ui/scripts/implemented-pages.mjs'
      - 'theme/build.gradle'
      - '.github/workflows/keycloak-drift.yml'
      - 'theme/ui/package.json'
      - 'theme/ui/yarn.lock'
      - 'theme/ui/dev-server/**'
      - 'theme/build.gradle'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Keycloak check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade report compares against the version on the branch this one came from.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      # Only for keycloakify's bundled message set, which the check reads to decide whether the
      # stand-ins in src/i18n.ts are still needed.
      - name: Install dependencies
        working-directory: theme/ui
        # The release .yarnrc.yml names: a glob would pass a second one to the first as an argument.
        run: |
          node "$(sed -n 's/^yarnPath: *//p' .yarnrc.yml)" install --immutable

      # On a branch that moves the pinned version this also reports what changed upstream, and
      # fails when Keycloak has relabelled a control on a page this theme implements.
      - name: Check against Keycloak
        working-directory: theme/ui
        run: node scripts/check-keycloak-drift.mjs

  # The image build skips downloadStockKeycloak so a release cannot fail on Maven Central being
  # unreachable, which leaves nothing exercising the download or the renderer behind the dev
  # server's stock pages. This job is that, and it belongs here for the same reason: this
  # workflow is already the one allowed to depend on Maven Central.
  stock-renderer:
    name: Dev server stock renderer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and gradle cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Download Keycloak's themes
        run: ./gradlew downloadStockKeycloak

      # Covered nowhere else: the image build skips the download this needs. The script is
      # runnable by hand as well, which is the point of it being a script.
      - name: Render a stock page
        run: theme/ui/dev-server/check-stock-renderer.sh
