# Overrides and additions on top of Keycloak's base login messages.
# Realm-specific wording (app title, brand name) is supplied at runtime from
# manager_config.json by branding.js, not from here.

applicationName=OpenRemote

# Headings, worded to match the OpenRemote design.
loginAccountTitle=Log in to your account
emailForgotTitle=Password recovery
registerTitle=Register new account
# Keycloak 26.7 ships this string with "Autenticator" misspelled.
loginTotpTitle=Mobile Authenticator Setup

doLogIn=Log in
# The design labels this "Email address"; Keycloak's base bundle says just "Email".
email=Email address
# Base has "New Password". Everything else in the design is sentence case ("First name",
# "Confirm password", "One-time code"), so match that.
passwordNew=New password
# Base (and the design) say "Device Name"; sentence case is the house style for every other
# field label, so this one is deliberately not the design's capitalisation.
loginTotpDeviceName=Device name
backToLogin=Back to login
backToLoginCredentials=Back to login credentials
select2faDevice=Select your 2FA device
identityProviderLoginLabel=Or continue with
