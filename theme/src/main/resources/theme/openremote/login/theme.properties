parent=base
import=common/keycloak

# Version of the OpenRemote design system vendored into resources/vendor.
# Used purely as a cache-busting query string on the vendored asset URLs:
# Keycloak's ${url.resourcesPath} only embeds a segment derived from the Keycloak
# version, so a theme-only change within the same Keycloak release would otherwise
# stay cached in browsers, mobile apps and desktop apps.
# Bump this together with OR_UI_VERSION in the Dockerfile.
orUiVersion=1.29.0

# Base URL of the OpenRemote manager, used to fetch per-realm branding from
# /api/{realm}/configuration/manager.
#
# Leave empty in production. Keycloak needs a fixed hostname there, and that hostname
# is by construction also one of the manager's domains (the proxy serves the manager at
# / and Keycloak at /auth), so a same-origin relative fetch always reaches a manager.
# Branding is keyed on realm rather than domain, so it does not matter which of several
# manager domains the user originally arrived from.
#
# Set this only when Keycloak is served from an origin that has no manager behind it,
# which includes the split-origin development setup (manager on 127.0.0.1:8080,
# Keycloak on 127.0.0.1:8081). Such a deployment also needs the Keycloak origin added
# to OR_WEBSERVER_ALLOWED_ORIGINS on the manager, since production CORS is not "*".
managerUrl=

meta=viewport==width=device-width,initial-scale=1
