# Message overrides appended to the bundle Keycloakify generates, so that Keycloak resolves
# them server-side. See theme/build.gradle.
#
# Almost all of this theme's wording is overridden client-side in ui/src/i18n.ts, which is
# where new overrides belong. This file is for the narrow set of keys Keycloak substitutes
# into kcContext *before* the page runs: user profile attribute labels arrive as "${email}"
# and friends, already resolved, and that resolution outranks anything the client supplies.
# Overriding such a key only in i18n.ts silently does nothing - which is how the register page
# ended up labelling a field "Email" while the login page called the same thing
# "Email address".
#
# Anything listed here must therefore be listed in i18n.ts too, for the pages that ask for it
# by key rather than receiving it pre-resolved. Everything else belongs in i18n.ts alone.

# The design labels this "Email address"; Keycloak's base bundle says just "Email".
email=Email address
